        const y = e.clientY - rect.top;
        
        setCoords({ x, y });
      };

        setIsHovered(true);
      };

      const handleMouseLeave = () => {
        setIsHovered(false);
      };

          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}

                      {selectedProject.features.map((feature, idx) => (
                        <li key={idx} className="flex items-center gap-2.5 text-xs text-zinc-300">
                          <div className="w-5 h-5 rounded-full bg-[#FF7A00]/10 flex items-center justify-center shrink-0">
                            <Check className="w-3 h-3 text-[#FF7A00]" />
                          </div>
                          {feature}
                        </li>
                      ))}
                    </ul>
                  </div>

                  {/* My Contribution */}
                  {selectedProject.contribution && (
                    <div className="space-y-3">
                      <h3 className="text-[14px] font-mono uppercase tracking-widest text-zinc-400 border-b border-zinc-900 pb-2">My Contribution</h3>
                      <ul className="space-y-2">
                        {selectedProject.contribution.map((item, idx) => (
                          <li key={idx} className="flex items-center gap-2.5 text-xs text-zinc-300">
                            <div className="w-5 h-5 rounded-full bg-[#FF7A00]/10 flex items-center justify-center shrink-0">
                              <span className="text-[10px] text-[#FF7A00] font-extrabold">•</span>
                            </div>
                            {item}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Calculation Flow / Workflow */}
                  {selectedProject.workflow && (
                    <div className="space-y-3">
                      <h3 className="text-[14px] font-mono uppercase tracking-widest text-zinc-400 border-b border-zinc-900 pb-2">
                        {selectedProject.id === 'solarscope' ? 'Calculation Flow' : 'Workflow Pipeline'}
                      </h3>
                      <div className="relative border-l-2 border-zinc-800 ml-2.5 pl-5 space-y-4">
                        {selectedProject.workflow.map((step, idx) => (
                          <div key={idx} className="relative">
                            <div className="absolute -left-[27px] top-0.5 w-3 h-3 rounded-full bg-[#0b0c10] border-2 border-[#FF7A00] flex items-center justify-center" />
                            <div className="text-xs font-semibold text-zinc-300 font-mono">Step {idx + 1}</div>
                            <div className="text-xs text-zinc-400 mt-1">{step}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Social / Environmental Impact */}
                  {selectedProject.impact && (
                    <div className="space-y-3">
                      <h3 className="text-[14px] font-mono uppercase tracking-widest text-zinc-400 border-b border-zinc-900 pb-2">
                        {selectedProject.id === 'solarscope' ? 'Environmental Impact' : 'Social Impact'}
                      </h3>
                      <div className="p-4 rounded-xl bg-emerald-950/20 border border-emerald-900/30 flex gap-3">
                        <div className="w-8 h-8 rounded-full bg-emerald-500/10 flex items-center justify-center text-emerald-400 shrink-0 text-sm">
                          🍃
                        </div>
                        <p className="text-xs text-zinc-300 leading-relaxed italic">
                          "{selectedProject.impact}"
                        </p>
                      </div>
                    </div>
                  )}

                  {/* Future Enhancements / Future Vision */}
                  {selectedProject.futureVision && (
                    <div className="space-y-3">
                      <h3 className="text-[14px] font-mono uppercase tracking-widest text-zinc-400 border-b border-zinc-900 pb-2">Future Enhancements</h3>
                      <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        {selectedProject.futureVision.map((item, idx) => (
                          <li key={idx} className="flex items-start gap-2 text-xs text-zinc-300 bg-zinc-900/30 border border-[#2A2A2A] p-2.5 rounded-lg">
                            <span className="text-[#FF7A00] font-mono text-[10px] mt-0.5">⚡</span>
                            <span>{item}</span>
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}


                  {/* Supported Data / Coverage */}
                  {selectedProject.supportedData && (
                    <div className="space-y-3">
                      <h3 className="text-[14px] font-mono uppercase tracking-widest text-zinc-400 border-b border-zinc-900 pb-2">Coverage & Databases</h3>
                      <div className="flex flex-wrap gap-2">
                        {selectedProject.supportedData.map((dataItem, idx) => (
                          <span key={idx} className="text-[10px] bg-zinc-900/60 border border-zinc-800 px-3 py-1 rounded-lg text-zinc-300 font-mono">
                            {dataItem}
                          </span>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* Unique Highlights list */}
                  {selectedProject.highlights && (
                    <div className="space-y-3">
                      <h3 className="text-[14px] font-mono uppercase tracking-widest text-zinc-400 border-b border-[#2A2A2A] pb-2">Unique Highlights</h3>
                      <ul className="space-y-2">
                        {selectedProject.highlights.map((highlight, idx) => (
                          <li key={idx} className="flex items-center gap-2.5 text-xs text-zinc-300">
                            <div className="w-5 h-5 rounded-full bg-pink-500/10 flex items-center justify-center shrink-0">
                              <Check className="w-3 h-3 text-pink-400" />
                            </div>
                            {highlight}
                          </li>
                        ))}
                      </ul>
                    </div>
                  )}

                  {/* Team Credits */}
                  {selectedProject.team && (
                    <div className="pt-6 mt-6 border-t border-[#2A2A2A] text-center">
                      <p className="text-[10px] text-zinc-500 font-mono italic">
                        {selectedProject.team}
                      </p>
                    </div>
                  )}

                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render
    createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
